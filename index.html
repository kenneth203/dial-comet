<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/apple-touch-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="icon" type="desktop-touch-icon-portal/png" href="favicon.png">
    
    <!-- Critical CSS - Inline essential styles to prevent render blocking -->
    <style>
      /* Critical CSS Variables - Essential for layout and theming */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 355 70% 45%;
        --primary-foreground: 0 0% 100%;
        --border: 214.3 31.8% 91.4%;
        --ring: 222.2 84% 4.9%;
        --radius: 0.5rem;
      }
      
      /* Critical base styles */
      *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: theme('borderColor.DEFAULT', currentColor); }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      
      /* Loading state for better UX */
      .critical-loading { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        background: hsl(var(--background));
        color: hsl(var(--foreground));
      }
    </style>
    
    <!-- Cache-friendly resource hints for better client-side caching -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://maps.googleapis.com">

    <link rel="icon" href="/favicon.png?v=2" type="image/png" sizes="any">
    <link rel="shortcut icon" href="/favicon.png?v=2" type="image/png">

    <title>The VA Team Portal</title>
    <meta name="description" content="The VA Team Portal - Telephone Answering Management System" />
    <meta name="author" content="The VA Team" />
    <meta name="supabase-url" content="%VITE_SUPABASE_URL%" />

    <meta property="og:title" content="The VA Team Portal" />
    <meta property="og:description" content="The VA Team Portal - Telephone Answering Management System" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

  </head>

  <body>
    <div id="root">
      <!-- Static pre-React fallback. main.tsx removes this synchronously
           after React mounts, so it cannot overlap the working app. -->
      <div class="critical-loading" id="__critical_loading">
        <div style="
          width: 32px;
          height: 32px;
          border: 3px solid hsl(var(--border));
          border-top: 3px solid hsl(var(--primary));
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
      </div>
    </div>
    <!-- Static failsafe: if React has not marked itself mounted within
         ~15s, replace the spinner with a Reload / Clear-session panel.
         Never reloads automatically. Removed once React mounts. -->
    <div id="__static_failsafe" style="display:none;position:fixed;inset:0;z-index:2147483001;background:rgba(247,247,249,0.96);align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;">
      <div style="max-width:480px;width:100%;padding:24px;background:white;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
        <h1 style="margin:0;font-size:20px;font-weight:600;">Still loading…</h1>
        <p style="margin-top:8px;color:#555;">
          The application is taking longer than expected to start. You can reload,
          or clear the local sign-in state and start fresh. Nothing will reload
          automatically.
        </p>
        <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
          <button id="__static_reload" style="padding:10px 16px;border-radius:8px;background:#1c477a;color:white;border:0;cursor:pointer;font-weight:500;">Reload</button>
          <button id="__static_clear" style="padding:10px 16px;border-radius:8px;background:white;color:#1c477a;border:1px solid #1c477a;cursor:pointer;font-weight:500;">Clear session &amp; retry</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var TIMEOUT_MS = 15000;
        var recordReason = function (reason, source) {
          try {
            sessionStorage.setItem('app:last-reload', JSON.stringify({
              reason: reason, source: source, ts: Date.now(),
              route: location.pathname
            }));
          } catch (_) {}
        };
        var clearProjectKey = function () {
          try {
            var url = document.querySelector('meta[name="supabase-url"]');
            // Best-effort key derivation from meta tag (optional); otherwise
            // no-op — we never prefix-scan.
            if (url && url.content) {
              var ref = new URL(url.content).hostname.split('.')[0];
              if (ref) localStorage.removeItem('sb-' + ref + '-auth-token');
            }
          } catch (_) {}
        };
        var timer = setTimeout(function () {
          if (window.__reactMounted) return;
          var el = document.getElementById('__static_failsafe');
          if (el) el.style.display = 'flex';
        }, TIMEOUT_MS);
        window.__clearBootFailsafe = function () {
          window.__reactMounted = true;
          clearTimeout(timer);
          var loading = document.getElementById('__critical_loading');
          if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
          var failsafe = document.getElementById('__static_failsafe');
          if (failsafe && failsafe.parentNode) failsafe.parentNode.removeChild(failsafe);
        };
        document.addEventListener('DOMContentLoaded', function () {
          var reloadBtn = document.getElementById('__static_reload');
          var clearBtn = document.getElementById('__static_clear');
          if (reloadBtn) reloadBtn.addEventListener('click', function () {
            recordReason('static-failsafe-reload', 'index.html');
            location.reload();
          });
          if (clearBtn) clearBtn.addEventListener('click', function () {
            clearProjectKey();
            recordReason('static-failsafe-recover', 'index.html');
            location.replace('/auth');
          });
        });
      })();
    </script>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
